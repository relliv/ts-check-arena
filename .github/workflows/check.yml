# Lint-free gate for every push and pull request: types, unit tests, the site build
# and a one-round smoke run of every installed checker on the small fixture, on the
# three operating systems.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: GNU time
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends time
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke run
        run: pnpm arena run --target fixtures/small --smoke --threads default,1
      - name: Smoke report
        if: always()
        run: cat results/.smoke/*/report.md >> "$GITHUB_STEP_SUMMARY" || true
