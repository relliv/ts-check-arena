# The cross-platform benchmark: every installed checker on the pinned corpus, on six
# runners. Results go to the data branch (one folder per run), which the site
# workflow publishes. Runs weekly, by hand, and when tools/ changes on main.
name: bench

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      rounds:
        description: Timed rounds (odd)
        default: '11'
      threads:
        description: Thread settings, such as default,1,4,max
        default: default,1,max
  push:
    branches: [main]
    paths: ['tools/**', 'checkers.json', 'corpus.json', 'pnpm-lock.yaml']

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ARENA_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: GNU time
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends time
      - run: pnpm install --frozen-lockfile
      - run: pnpm arena corpus setup
      - name: Benchmark
        run: |
          for project in $(node -e "console.log(require('./corpus.json').projects.map(p => p.name).join(' '))"); do
            pnpm arena run --corpus "$project" --rounds "${ROUNDS:-11}" --threads "${THREADS:-default,1,max}"
          done
        env:
          ROUNDS: ${{ inputs.rounds }}
          THREADS: ${{ inputs.threads }}
      - name: Report
        if: always()
        run: cat results/*/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.runner }}
          path: |
            results/
            !results/private/
            !results/.smoke/
            !results/index.json
          if-no-files-found: ignore

  publish:
    needs: bench
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: incoming
          merge-multiple: true
      - name: Commit to the data branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data
            git worktree add data origin/data
            git -C data switch -C data
          else
            git worktree add --orphan -b data data
          fi
          mkdir -p data/results
          cp -R incoming/. data/results/ 2>/dev/null || true
          ARENA_RESULTS_DIR=data/results node src/cli.ts index
          git -C data add results
          if git -C data diff --cached --quiet; then echo 'no new results'; exit 0; fi
          git -C data commit -m "results: bench run ${GITHUB_RUN_ID}"
          git -C data push origin data
