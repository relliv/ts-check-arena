# Daily: looks on npm for checker versions past the 7-day release age that the store
# lacks, adds them and opens a pull request. Merging it triggers the bench workflow.
# A version pnpm's trust policy refuses fails the install; it then needs a reviewed
# exception by hand (pnpm arena tool add <id> --allow-trust-downgrade).
name: watch

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: New versions
        id: found
        run: |
          node src/cli.ts watch --write | tee found.txt
          if git diff --quiet -- tools && [ -z "$(git ls-files --others --exclude-standard tools)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.found.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Pull request
        if: steps.found.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="tools/new-versions-$(date -u +%Y%m%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add tools pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "build(tools): add $(paste -sd ' ' found.txt)"
          git push origin "$branch"
          gh pr create --title "build(tools): new checker versions" --body "Versions past the 7-day release age, found by the watch workflow: $(paste -sd ',' found.txt | sed 's/,/, /g')."
